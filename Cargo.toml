[package]
name = "nixpresence"
version = "0.1.0"
edition = "2021"
description = "NixOS-friendly VRChat chatbox + Discord presence daemon (Linux)"
license = "MIT"
authors = ["Vincent (neo@zionsec)"]
readme = "README.md"
keywords = ["vrchat", "osc", "discord", "mpris", "nixos"]
categories = ["command-line-utilities"]
repository = "https://github.com/r3dg0d/nixpresence"

[[bin]]
name = "nixpresence"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
directories = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "fs", "io-util", "signal"] }
futures = "0.3"
async-trait = "0.1"
rosc = "0.10"
unicode-segmentation = "1"
sysinfo = "0.33"
nvml-wrapper = "0.10"
zbus = { version = "5", default-features = true }
discord-rich-presence = "0.2.5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
hostname = "0.4"
nix = { version = "0.29", features = ["process", "signal", "user"] }
bytes = "1"
parking_lot = "0.12"
once_cell = "1"
regex = "1"
ctrlc = "3"
crossterm = "0.28"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
